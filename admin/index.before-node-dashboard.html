<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FootballXtra Admin</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">

  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      font-family: Inter, sans-serif;
      background: #050807;
      color: white;
    }

    .glass {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
    }

    input, textarea, select {
      background: #111715 !important;
      color: white !important;
      border: 1px solid #26332e !important;
    }

    input:focus, textarea:focus, select:focus {
      border-color: #22c55e !important;
      outline: none;
    }
  </style>
</head>

<body>

  <header class="border-b border-white/10 sticky top-0 bg-black/80 backdrop-blur-xl z-50">
    <div class="max-w-6xl mx-auto px-4 py-4 flex items-center justify-between">

      <a href="../index.html"
         class="font-black text-xl tracking-tight">
        FOOTBALL<span class="text-green-400">XTRA</span>
      </a>

      <div class="flex items-center gap-3">
        <span id="adminName" class="text-sm text-gray-400"></span>

        <a href="../index.html"
           class="px-4 py-2 rounded-xl bg-white/5 hover:bg-white/10 text-sm">
          <i class="fa-solid fa-house mr-1"></i>
          Home
        </a>
      </div>

    </div>
  </header>


  <main class="max-w-4xl mx-auto px-4 py-8">

    <div class="mb-8">
      <p class="text-green-400 text-xs font-black tracking-widest">
        FOOTBALLXTRA ADMIN
      </p>

      <h1 class="text-3xl md:text-4xl font-black mt-2">
        Create Post
      </h1>

      <p class="text-gray-500 mt-2">
        Publish football news and videos to the community feed.
      </p>
    </div>


    <!-- LOGIN / ACCESS -->
    <div id="accessMessage"
         class="glass rounded-2xl p-8 text-center hidden">

      <i class="fa-solid fa-lock text-4xl text-red-400 mb-4"></i>

      <h2 class="text-xl font-bold">
        Admin Access Required
      </h2>

      <p class="text-gray-500 mt-2 mb-5">
        Please login with an authorized admin account.
      </p>

      <a href="../login.html"
         class="inline-block bg-green-500 hover:bg-green-400 text-black font-bold px-6 py-3 rounded-xl">
        Login
      </a>

    </div>


    <!-- ADMIN PANEL -->
    <div id="adminPanel" class="hidden">

      <form id="postForm" class="space-y-6">


        <!-- POST TYPE -->

        <div class="glass rounded-2xl p-5">

          <label class="block text-sm font-bold mb-3">
            Post Type
          </label>

          <div class="grid grid-cols-2 gap-3">

            <button type="button"
                    data-type="news"
                    class="typeBtn active-type p-4 rounded-xl border border-green-500 bg-green-500/10">
              <i class="fa-solid fa-newspaper text-xl text-green-400"></i>
              <div class="font-bold mt-2">News</div>
            </button>

            <button type="button"
                    data-type="video"
                    class="typeBtn p-4 rounded-xl border border-white/10">
              <i class="fa-solid fa-video text-xl text-red-400"></i>
              <div class="font-bold mt-2">Video</div>
            </button>

          </div>

          <input type="hidden" id="postType" value="news">

        </div>


        <!-- TITLE -->

        <div class="glass rounded-2xl p-5">

          <label class="block text-sm font-bold mb-2">
            Title
          </label>

          <input
            id="postTitle"
            type="text"
            required
            maxlength="200"
            placeholder="Manchester United sign new player..."
            class="w-full px-4 py-3 rounded-xl">

        </div>


        <!-- CONTENT -->

        <div class="glass rounded-2xl p-5">

          <label class="block text-sm font-bold mb-2">
            Content
          </label>

          <textarea
            id="postContent"
            rows="7"
            required
            placeholder="Write your football news here..."
            class="w-full px-4 py-3 rounded-xl resize-none"></textarea>

        </div>


        <!-- MEDIA URL -->

        <div class="glass rounded-2xl p-5">

          <label class="block text-sm font-bold mb-2">
            Image / Video URL
          </label>

          <input
            id="mediaUrl"
            type="url"
            placeholder="https://..."
            class="w-full px-4 py-3 rounded-xl">

          <p id="mediaHelp"
             class="text-xs text-gray-500 mt-2">
            Add an image URL for the news post.
          </p>

        </div>


        <!-- THUMBNAIL -->

        <div id="thumbnailBox"
             class="glass rounded-2xl p-5">

          <label class="block text-sm font-bold mb-2">
            Thumbnail URL
          </label>

          <input
            id="thumbnailUrl"
            type="url"
            placeholder="https://..."
            class="w-full px-4 py-3 rounded-xl">

          <p class="text-xs text-gray-500 mt-2">
            Optional video thumbnail.
          </p>

        </div>


        <!-- PREVIEW -->

        <div class="glass rounded-2xl p-5">

          <h3 class="font-bold mb-4">
            <i class="fa-solid fa-eye text-green-400 mr-2"></i>
            Preview
          </h3>

          <div id="preview"
               class="rounded-xl bg-black/40 p-5 text-gray-500 text-sm">
            Your post preview will appear here.
          </div>

        </div>


        <!-- PUBLISH -->

        <button
          id="publishBtn"
          type="submit"
          class="w-full py-4 rounded-xl bg-green-500 hover:bg-green-400 text-black font-black text-lg">

          <i class="fa-solid fa-paper-plane mr-2"></i>
          Publish Post

        </button>

        <div id="status"
             class="hidden text-center text-sm rounded-xl p-4"></div>

      </form>

    </div>

  </main>


  <script type="module">

    import { auth, db } from "../js/firebase.js";

    import {
      onAuthStateChanged
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";

    import {
      doc,
      getDoc,
      addDoc,
      collection,
      serverTimestamp
    } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


    /*
      IMPORTANT:

      For now admin access is controlled by the Firestore users/{uid}
      document.

      The user's document must contain:

      role: "admin"
    */


    const accessMessage = document.getElementById("accessMessage");
    const adminPanel = document.getElementById("adminPanel");
    const adminName = document.getElementById("adminName");

    const postForm = document.getElementById("postForm");
    const publishBtn = document.getElementById("publishBtn");
    const statusBox = document.getElementById("status");

    const postType = document.getElementById("postType");
    const postTitle = document.getElementById("postTitle");
    const postContent = document.getElementById("postContent");
    const mediaUrl = document.getElementById("mediaUrl");
    const thumbnailUrl = document.getElementById("thumbnailUrl");

    const thumbnailBox = document.getElementById("thumbnailBox");
    const mediaHelp = document.getElementById("mediaHelp");

    const preview = document.getElementById("preview");

    let currentUser = null;
    let currentProfile = null;


    // =========================
    // AUTH + ADMIN CHECK
    // =========================

    onAuthStateChanged(auth, async (user) => {

      if (!user) {
        accessMessage.classList.remove("hidden");
        adminPanel.classList.add("hidden");
        return;
      }

      currentUser = user;

      try {

        const userSnap =
          await getDoc(doc(db, "users", user.uid));

        if (!userSnap.exists()) {
          accessMessage.classList.remove("hidden");
          return;
        }

        const profile = userSnap.data();

        currentProfile = profile;

        if (profile.role !== "admin") {

          accessMessage.classList.remove("hidden");
          adminPanel.classList.add("hidden");

          return;
        }

        adminName.textContent =
          profile.name || user.displayName || "Admin";

        adminPanel.classList.remove("hidden");
        accessMessage.classList.add("hidden");

      } catch (error) {

        console.error(error);

        accessMessage.classList.remove("hidden");
        adminPanel.classList.add("hidden");

      }

    });


    // =========================
    // POST TYPE
    // =========================

    document.querySelectorAll(".typeBtn").forEach(button => {

      button.addEventListener("click", () => {

        document.querySelectorAll(".typeBtn").forEach(btn => {

          btn.classList.remove(
            "active-type",
            "border-green-500",
            "bg-green-500/10"
          );

          btn.classList.add("border-white/10");

        });

        button.classList.add(
          "active-type",
          "border-green-500",
          "bg-green-500/10"
        );

        button.classList.remove("border-white/10");

        const type = button.dataset.type;

        postType.value = type;

        if (type === "video") {

          thumbnailBox.classList.remove("hidden");

          mediaHelp.textContent =
            "Add the direct video URL. Example: MP4 video URL.";

        } else {

          thumbnailBox.classList.remove("hidden");

          mediaHelp.textContent =
            "Add an image URL for the news post.";

        }

        updatePreview();

      });

    });


    // =========================
    // PREVIEW
    // =========================

    [
      postTitle,
      postContent,
      mediaUrl,
      thumbnailUrl
    ].forEach(input => {

      input.addEventListener("input", updatePreview);

    });


    function escapeHTML(value = "") {

      return value
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function updatePreview() {

      const type = postType.value;

      const title = escapeHTML(postTitle.value);
      const content = escapeHTML(postContent.value);
      const media = escapeHTML(mediaUrl.value);
      const thumb = escapeHTML(thumbnailUrl.value);

      let mediaHTML = "";

      if (media) {

        if (type === "video") {

          mediaHTML = `
            <div class="mt-4 rounded-xl overflow-hidden bg-black aspect-video relative">
              ${
                thumb
                  ? `<img src="${thumb}" class="w-full h-full object-cover">`
                  : ""
              }

              <div class="absolute inset-0 flex items-center justify-center">
                <div class="w-14 h-14 rounded-full bg-green-500 text-black flex items-center justify-center">
                  <i class="fa-solid fa-play"></i>
                </div>
              </div>
            </div>
          `;

        } else {

          mediaHTML = `
            <img
              src="${media}"
              class="mt-4 w-full rounded-xl max-h-80 object-cover"
              onerror="this.style.display='none'">
          `;

        }

      }

      preview.innerHTML = `

        <div>

          <div class="flex items-center gap-3">

            <div class="w-10 h-10 rounded-full bg-green-500/20 flex items-center justify-center">
              <i class="fa-solid fa-user text-green-400"></i>
            </div>

            <div>
              <div class="font-bold text-white">
                ${escapeHTML(
                  currentProfile?.name ||
                  currentUser?.displayName ||
                  "FootballXtra"
                )}
              </div>

              <div class="text-xs text-gray-500">
                @footballxtra
              </div>
            </div>

          </div>

          <h3 class="font-black text-lg text-white mt-4">
            ${title || "Post title"}
          </h3>

          <p class="text-gray-400 mt-2 whitespace-pre-wrap">
            ${content || "Post content..."}
          </p>

          ${mediaHTML}

        </div>

      `;

    }


    // =========================
    // PUBLISH
    // =========================

    postForm.addEventListener("submit", async (event) => {

      event.preventDefault();

      if (!currentUser || !currentProfile) {

        showStatus(
          "You must be logged in as an admin.",
          false
        );

        return;

      }

      if (currentProfile.role !== "admin") {

        showStatus(
          "Admin access required.",
          false
        );

        return;

      }

      const type = postType.value;
      const title = postTitle.value.trim();
      const content = postContent.value.trim();
      const media = mediaUrl.value.trim();
      const thumbnail = thumbnailUrl.value.trim();

      if (!title || !content) {

        showStatus(
          "Title and content are required.",
          false
        );

        return;

      }

      publishBtn.disabled = true;

      publishBtn.innerHTML = `
        <i class="fa-solid fa-spinner fa-spin mr-2"></i>
        Publishing...
      `;

      try {

        const postData = {

          authorId: currentUser.uid,

          authorName:
            currentProfile.name ||
            currentUser.displayName ||
            "FootballXtra",

          authorPhoto:
            currentProfile.photoURL ||
            currentUser.photoURL ||
            "",

          authorUsername:
            currentProfile.username ||
            "footballxtra",

          authorVerified:
            currentProfile.verified === true ||
            currentProfile.role === "admin",

          type,

          title,

          content,

          image:
            type === "news"
              ? media
              : "",

          mediaUrl:
            type === "video"
              ? media
              : "",

          thumbnailUrl:
            type === "video"
              ? thumbnail
              : "",

          createdAt: serverTimestamp(),

          likesCount: 0,
          commentsCount: 0,
          repostsCount: 0

        };


        const postRef =
          await addDoc(
            collection(db, "posts"),
            postData
          );


        console.log(
          "Post published:",
          postRef.id
        );


        showStatus(
          "Post published successfully! ⚽🔥",
          true
        );


        postForm.reset();

        postType.value = "news";

        document.querySelectorAll(".typeBtn").forEach(btn => {

          btn.classList.remove(
            "active-type",
            "border-green-500",
            "bg-green-500/10"
          );

          btn.classList.add("border-white/10");

        });

        const newsBtn =
          document.querySelector('[data-type="news"]');

        newsBtn.classList.add(
          "active-type",
          "border-green-500",
          "bg-green-500/10"
        );

        newsBtn.classList.remove("border-white/10");

        updatePreview();


      } catch (error) {

        console.error(
          "Publish error:",
          error
        );

        showStatus(
          "Failed to publish: " + error.message,
          false
        );

      } finally {

        publishBtn.disabled = false;

        publishBtn.innerHTML = `
          <i class="fa-solid fa-paper-plane mr-2"></i>
          Publish Post
        `;

      }

    });


    function showStatus(message, success) {

      statusBox.textContent = message;

      statusBox.classList.remove(
        "hidden",
        "bg-green-500/10",
        "text-green-400",
        "bg-red-500/10",
        "text-red-400"
      );

      if (success) {

        statusBox.classList.add(
          "bg-green-500/10",
          "text-green-400"
        );

      } else {

        statusBox.classList.add(
          "bg-red-500/10",
          "text-red-400"
        );

      }

      setTimeout(() => {

        statusBox.classList.add("hidden");

      }, 5000);

    }


    updatePreview();

  </script>

</body>
</html>
