<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fixtures - VibeSport</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      background: #07110d;
      color: white;
      min-height: 100vh;
    }

    .glass {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
    }

    .fixture-tab.active,
    .league-tab.active {
      border-color: rgba(74,222,128,.6);
      color: #4ade80;
      background: rgba(34,197,94,.10);
    }
  </style>
</head>

<body>

<header class="sticky top-0 z-50 glass">
  <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

    <a href="index.html" class="font-black text-xl">
      Vibe<span class="text-green-400">Sport</span>
    </a>

    <a href="index.html"
       class="text-sm text-gray-300 hover:text-green-400">
      <i class="fa-solid fa-arrow-left mr-2"></i>
      Home
    </a>

  </div>
</header>

<main class="max-w-7xl mx-auto px-4 py-8">

  <div class="flex items-center justify-between gap-3 mb-6">

    <div>
      <h1 class="text-3xl font-black">
        Fixtures
      </h1>

      <p class="text-sm text-gray-500 mt-1">
        Upcoming football matches
      </p>
    </div>

    <button
      id="refreshFixtures"
      type="button"
      class="glass px-4 py-2 rounded-xl text-sm font-bold hover:border-green-400/40 transition">

      <i class="fa-solid fa-rotate mr-2"></i>
      Refresh

    </button>

  </div>


  <div
    id="fixtureDateNav"
    class="flex gap-2 overflow-x-auto pb-2 mb-5">

    <button
      data-offset="-1"
      class="fixture-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      Yesterday
    </button>

    <button
      data-offset="0"
      class="fixture-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      Today
    </button>

    <button
      data-offset="live"
      class="fixture-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      🔴 Live
    </button>

    <button
      data-offset="1"
      class="fixture-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      Tomorrow
    </button>

    <label
      class="glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap cursor-pointer">
      📅
      <input
        id="fixtureDatePicker"
        type="date"
        class="ml-2 bg-transparent text-gray-200 outline-none"
        aria-label="Choose fixture date">
    </label>

  </div>


  <div
    id="leagueNav"
    class="flex gap-2 overflow-x-auto pb-3 mb-6 sticky top-[73px] z-40"
    style="background:rgba(7,17,13,.94);backdrop-filter:blur(14px);">

    <button
      data-league="all"
      class="league-tab active glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      All
    </button>

    <button
      data-league="English Premier League"
      class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      Premier League
    </button>

    <button
      data-league="LaLiga"
      class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      LaLiga
    </button>

    <button
      data-league="Serie A"
      class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      Serie A
    </button>

    <button
      data-league="Bundesliga"
      class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      Bundesliga
    </button>

    <button
      data-league="Ligue 1"
      class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      Ligue 1
    </button>

    <button
      data-league="UEFA Champions League"
      class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
      Champions League
    </button>

  </div>


  <div
    id="fixturesStatus"
    class="text-sm text-gray-500 mb-5">
    Loading fixtures...
  </div>


  <div
    id="fixturesContainer"
    class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
  </div>

</main>


<script type="module">

  const API_BASE =
    "https://footballxtra-website.onrender.com";

  const container =
    document.getElementById("fixturesContainer");

  const status =
    document.getElementById("fixturesStatus");

  const refreshButton =
    document.getElementById("refreshFixtures");

  let selectedOffset = 0;
  let selectedLeague = "all";
  let selectedCustomDate = "";
  let selectedMode = "date";


  function escapeHTML(value = "") {

    return String(value)
      .replace(/&/g, "&amp;")
      .replace(/</g, "&lt;")
      .replace(/>/g, "&gt;")
      .replace(/"/g, "&quot;")
      .replace(/'/g, "&#039;");

  }


  function logo(url, name = "") {

    const safeUrl =
      escapeHTML(url || "");

    const initials =
      escapeHTML(
        String(name || "FC")
          .split(" ")
          .map(word => word[0])
          .join("")
          .slice(0, 3)
          .toUpperCase()
      );

    if (!safeUrl) {

      return `
        <div
          class="w-12 h-12 mx-auto rounded-full glass
                 flex items-center justify-center
                 text-xs font-black text-green-400">
          ${initials}
        </div>
      `;

    }

    return `
      <img
        src="${safeUrl}"
        alt="${escapeHTML(name)}"
        class="w-12 h-12 mx-auto object-contain"
        onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">

      <div
        style="display:none"
        class="w-12 h-12 mx-auto rounded-full glass
               items-center justify-center
               text-xs font-black text-green-400">
        ${initials}
      </div>
    `;

  }


  function getAddisDate(offset = 0) {

    const parts =
      new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Addis_Ababa",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

    const year =
      Number(
        parts.find(p => p.type === "year").value
      );

    const month =
      Number(
        parts.find(p => p.type === "month").value
      );

    const day =
      Number(
        parts.find(p => p.type === "day").value
      );

    const date =
      new Date(
        Date.UTC(
          year,
          month - 1,
          day + offset
        )
      );

    return date
      .toISOString()
      .slice(0, 10);

  }


  function updateTabs() {

    document
      .querySelectorAll(".fixture-tab")
      .forEach(tab => {

        const value = tab.dataset.offset;
        const active =
          selectedMode === "live"
            ? value === "live"
            : selectedMode === "date" &&
              value !== "live" &&
              Number(value) === selectedOffset &&
              !selectedCustomDate;

        tab.classList.toggle(
          "active",
          active
        );

      });


    document
      .querySelectorAll(".league-tab")
      .forEach(tab => {

        const active =
          tab.dataset.league ===
          selectedLeague;

        tab.classList.toggle(
          "active",
          active
        );

      });

  }


  function formatKickoff(date) {

    if (!date) {
      return "--:--";
    }

    return new Date(date)
      .toLocaleTimeString(
        "en-GB",
        {
          hour: "2-digit",
          minute: "2-digit",
          hour12: false,
          timeZone: "Africa/Addis_Ababa"
        }
      );

  }


  function renderFixture(match) {

    const home =
      match.home || {};

    const away =
      match.away || {};

    const league =
      match.league || {};

    const matchStatus =
      match.status || {};

    const homeScore =
      match.goals?.home;

    const awayScore =
      match.goals?.away;

    const short =
      String(
        matchStatus.short || ""
      ).toLowerCase();

    const longStatus =
      String(
        matchStatus.long || ""
      ).toLowerCase();

    const isLive =
      short === "in" ||
      ["1h", "2h", "et", "p", "live", "bt"]
        .includes(short);

    const isFinished =
      short === "post" ||
      ["ft", "aet", "pen"]
        .includes(short) ||
      longStatus.includes("final") ||
      longStatus.includes("full time");

    const kickoff =
      formatKickoff(
        match.fixture?.date
      );

    const displayStatus =
      isLive
        ? "🔴 LIVE"
        : isFinished
          ? "⚪ FT"
          : `🕐 ${kickoff}`;

    const score =
      isFinished || isLive
        ? `${homeScore ?? 0} - ${awayScore ?? 0}`
        : "vs";

    const fixtureId =
      match.fixtureId || "";


    return `
      <article
        onclick="window.location.href='match.html?id=${encodeURIComponent(fixtureId)}'"
        class="glass rounded-2xl p-5
               hover:border-green-400/30
               transition cursor-pointer">

        <div
          class="flex items-center justify-between
                 gap-3 mb-5">

          <div class="min-w-0">

            <p
              class="font-bold text-gray-300 truncate">
              ${escapeHTML(
                league.name || "Football"
              )}
            </p>

            <p
              class="text-xs text-gray-500 truncate">
              ${escapeHTML(
                league.country || ""
              )}
            </p>

          </div>

          <span
            class="text-green-400 font-black
                   text-xs whitespace-nowrap">

            ${displayStatus}

          </span>

        </div>


        <div
          class="flex items-center
                 justify-between gap-3">

          <div
            class="text-center flex-1 min-w-0">

            ${logo(
              home.logo,
              home.name
            )}

            <p
              class="font-bold text-sm mt-2 truncate">
              ${escapeHTML(
                home.name || "Home"
              )}
            </p>

          </div>


          <div
            class="text-center shrink-0">

            <div
              class="text-2xl font-black">
              ${escapeHTML(score)}
            </div>

            <div
              class="text-[10px]
                     text-gray-500
                     font-bold mt-1">
              ${escapeHTML(
                match.fixture?.venue || ""
              )}
            </div>

          </div>


          <div
            class="text-center flex-1 min-w-0">

            ${logo(
              away.logo,
              away.name
            )}

            <p
              class="font-bold text-sm mt-2 truncate">
              ${escapeHTML(
                away.name || "Away"
              )}
            </p>

          </div>

        </div>

      </article>
    `;

  }


  async function loadFixtures() {

    updateTabs();

    const date =
      selectedCustomDate ||
      getAddisDate(
        selectedOffset
      );

    status.textContent =
      "Loading fixtures...";

    try {

      const response =
        await fetch(
          `${API_BASE}/api/matches/today-espn?date=${date}`,
          {
            cache: "no-store"
          }
        );

      if (!response.ok) {
        throw new Error(
          `HTTP ${response.status}`
        );
      }

      const data =
        await response.json();

      if (
        !data.success ||
        !Array.isArray(data.matches)
      ) {
        throw new Error(
          "Invalid API response"
        );
      }

      let matches =
        data.matches;

      if (selectedLeague !== "all") {

        matches =
          matches.filter(
            match =>
              match.league?.name ===
              selectedLeague
          );

      }


      if (selectedOffset === 1) {

        matches =
          matches.filter(match => {

            const short =
              String(
                match.status?.short || ""
              ).toLowerCase();

            return ![
              "post",
              "ft",
              "aet",
              "pen"
            ].includes(short);

          });

      }


      status.innerHTML = `
        <span
          class="text-green-400
                 font-bold">
          ● ${matches.length}
        </span>
        fixtures
      `;


      if (!matches.length) {

        container.innerHTML = `
          <div
            class="md:col-span-2
                   lg:col-span-3
                   glass rounded-2xl
                   p-10 text-center">

            <div class="text-5xl mb-4">
              ⚽
            </div>

            <p
              class="font-bold
                     text-gray-300">
              No fixtures found
            </p>

            <p
              class="text-xs
                     text-gray-500 mt-2">
              Try another date or league.
            </p>

          </div>
        `;

        return;

      }


      container.innerHTML =
        matches
          .map(renderFixture)
          .join("");

    } catch (error) {

      console.error(
        "Fixtures Error:",
        error
      );

      status.textContent =
        "Unable to load fixtures";

      container.innerHTML = `
        <div
          class="md:col-span-2
                 lg:col-span-3
                 glass rounded-2xl
                 p-8 text-center">

          <i
            class="fa-solid
                   fa-circle-exclamation
                   text-red-400
                   text-3xl mb-4">
          </i>

          <p
            class="font-bold
                   text-gray-300">
            Fixtures unavailable
          </p>

          <p
            class="text-xs
                   text-gray-500 mt-2">
            Please try again shortly.
          </p>

        </div>
      `;

    }

  }


  document
    .querySelectorAll(".fixture-tab")
    .forEach(tab => {

      tab.addEventListener(
        "click",
        () => {

          const value = tab.dataset.offset;

          if (value === "live") {
            selectedMode = "live";
            selectedOffset = 0;
            selectedCustomDate = "";
          } else {
            selectedMode = "date";
            selectedOffset = Number(value);
            selectedCustomDate = "";
          }

          loadFixtures();

        }
      );

    });


  document
    .querySelectorAll(".league-tab")
    .forEach(tab => {

      tab.addEventListener(
        "click",
        () => {

          selectedLeague =
            tab.dataset.league;

          loadFixtures();

        }
      );

    });


  const fixtureDatePicker =
    document.getElementById("fixtureDatePicker");

  if (fixtureDatePicker) {
    fixtureDatePicker.addEventListener("change", () => {
      if (!fixtureDatePicker.value) return;

      selectedMode = "date";
      selectedCustomDate = fixtureDatePicker.value;
      loadFixtures();
    });
  }

  refreshButton.addEventListener(
    "click",
    loadFixtures
  );


  loadFixtures();


  setInterval(
    loadFixtures,
    30000
  );

</script>

<nav class="bottom-nav fixed bottom-0 left-0 right-0 z-50 md:hidden bg-[#0b0f15]/95 backdrop-blur-xl border-t border-white/10">
  <div class="grid grid-cols-6 h-16">
    <a href="index.html" class="flex flex-col items-center justify-center text-gray-500">
      <i class="fa-solid fa-house"></i>
      <span class="text-[9px] mt-1">Home</span>
    </a>
    <a href="news.html" class="flex flex-col items-center justify-center text-gray-500">
      <i class="fa-regular fa-newspaper"></i>
      <span class="text-[9px] mt-1">News</span>
    </a>
    <a href="scores.html" class="flex flex-col items-center justify-center text-gray-500">
      <i class="fa-solid fa-futbol"></i>
      <span class="text-[9px] mt-1">Soccer</span>
    </a>
    <a href="predictions.html" class="flex flex-col items-center justify-center text-gray-500">
      <i class="fa-solid fa-ranking-star"></i>
      <span class="text-[9px] mt-1">Predictions</span>
    </a>
    <a href="videos.html" class="flex flex-col items-center justify-center text-gray-500">
      <i class="fa-brands fa-youtube"></i>
      <span class="text-[9px] mt-1">Videos</span>
    </a>
    <a id="mobileAccountLink" href="login.html" class="flex flex-col items-center justify-center text-gray-500">
      <i class="fa-regular fa-user"></i>
      <span class="text-[9px] mt-1">Profile</span>
    </a>
  </div>
</nav>

<style id="vibesport-nav-active-style">
.bottom-nav a.nav-active {
  color: #4ade80 !important;
}
</style>
<!-- VIBESPORT NAV ACTIVE STATE -->
<script>
(function () {
  function normalizePage(value) {
    const parts = (value || '').split(/[?#]/)[0].split('/').filter(Boolean);
    let page = (parts.length ? parts[parts.length - 1] : 'index.html').toLowerCase();
    page = page.replace(/\.html$/, '');
    return page || 'index';
  }

  function updateActiveNav() {
    const nav = document.querySelector('.bottom-nav');
    if (!nav) return;

    const page = normalizePage(location.pathname);

    nav.querySelectorAll('a').forEach(function (link) {
      const href = normalizePage(link.getAttribute('href'));
      const accountPage = link.id === 'mobileAccountLink' &&
        ['profile', 'login', 'signup'].includes(page);
      const active = href === page || accountPage;

      link.classList.toggle('nav-active', active);
      link.classList.toggle('text-gray-500', !active);
      link.classList.toggle('text-green-400', active);

      if (active) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateActiveNav);
  } else {
    updateActiveNav();
  }
})();
</script>

</body>
</html>
