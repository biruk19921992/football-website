<script type="module">

import { db, auth } from "./js/firebase.js";

import {
  collection,
  query,
  orderBy,
  getDocs,
  doc,
  getDoc,
  setDoc,
  deleteDoc,
  increment,
  serverTimestamp,
  addDoc
} from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";


const videoList = document.getElementById("videoList");
const videoSearch = document.getElementById("videoSearch");
const videoCount = document.getElementById("videoCount");
const featuredVideo = document.getElementById("featuredVideo");

let allVideos = [];
let activeCategory = "all";


function getYouTubeId(url = "") {

  const match = String(url).match(
    /(?:youtube\.com\/(?:watch\?v=|shorts\/|embed\/)|youtu\.be\/)([^&?/]+)/
  );

  return match ? match[1] : "";
}


function escapeHTML(value = "") {

  return String(value)
    .replaceAll("&", "&amp;")
    .replaceAll("<", "&lt;")
    .replaceAll(">", "&gt;")
    .replaceAll('"', "&quot;")
    .replaceAll("'", "&#039;");

}


function formatDate(timestamp) {

  if (!timestamp) return "";

  try {

    if (timestamp?.toDate) {
      return timestamp.toDate().toLocaleDateString("am-ET");
    }

    if (timestamp?._seconds) {
      return new Date(
        Number(timestamp._seconds) * 1000
      ).toLocaleDateString("am-ET");
    }

    const date = new Date(timestamp);

    if (Number.isNaN(date.getTime())) return "";

    return date.toLocaleDateString("am-ET");

  } catch {

    return "";

  }

}


function categoryName(category = "") {

  const names = {
    highlights: "Highlights",
    goals: "Goals",
    interviews: "Interviews",
    news: "News"
  };

  return names[category] || "Football";

}


function playVideo(video) {

  const youtubeId =
    video.youtubeId ||
    getYouTubeId(video.videoUrl || "");

  if (!youtubeId) return;

  window.FootballXtraMiniPlayer?.play(
    youtubeId,
    video.title || "Football Video"
  );

}


function renderFeatured(video) {

  if (!video) {
    featuredVideo.innerHTML = "";
    return;
  }

  const youtubeId =
    video.youtubeId ||
    getYouTubeId(video.videoUrl || "");

  if (!youtubeId) return;

  const thumbnail =
    video.thumbnailUrl ||
    video.image ||
    `https://i.ytimg.com/vi/${youtubeId}/hqdefault.jpg`;

  featuredVideo.innerHTML = `

    <article
      class="featured overflow-hidden rounded-3xl"
    >

      <div class="grid md:grid-cols-2">

        <button
          type="button"
          class="relative video-thumb min-h-[230px] md:min-h-[330px] text-left"
          data-featured-id="${escapeHTML(video.id)}"
        >

          <img
            src="${escapeHTML(thumbnail)}"
            alt="${escapeHTML(video.title || "Featured video")}"
          >

          <div class="absolute inset-0 bg-gradient-to-t from-black/70 via-black/10 to-transparent"></div>

          <div class="absolute inset-0 flex items-center justify-center">

            <span class="play-button">
              <i class="fa-solid fa-play ml-1 text-xl"></i>
            </span>

          </div>

          <span class="absolute top-3 left-3 px-3 py-1 rounded-full bg-green-500 text-black text-[10px] font-black uppercase">
            Featured
          </span>

        </button>

        <div class="p-5 md:p-7 flex flex-col justify-center">

          <span class="text-xs font-bold text-cyan-400 uppercase tracking-widest">
            ${escapeHTML(categoryName(video.category))}
          </span>

          <h2 class="text-2xl md:text-3xl font-black mt-2 leading-tight">
            ${escapeHTML(video.title || "Featured Video")}
          </h2>

          <p class="text-sm text-gray-400 mt-3 line-clamp-3">
            ${escapeHTML(video.content || "Watch the latest football action on VibeSport.")}
          </p>

          <div class="flex items-center gap-3 mt-5 text-xs text-gray-500">
            <span>
              <i class="fa-regular fa-calendar mr-1"></i>
              ${formatDate(video.createdAt || video.updatedAt)}
            </span>
          </div>

          <button
            type="button"
            data-featured-id="${escapeHTML(video.id)}"
            class="featured-play mt-5 w-fit px-5 py-2.5 rounded-xl bg-white text-black font-black text-sm"
          >
            <i class="fa-solid fa-play mr-2"></i>
            Watch now
          </button>

        </div>

      </div>

    </article>

  `;

}


function renderVideos() {

  const search =
    videoSearch.value.trim().toLowerCase();

  const filtered = allVideos.filter(video => {

    const title =
      String(video.title || "").toLowerCase();

    const content =
      String(video.content || "").toLowerCase();

    const category =
      String(video.category || "").toLowerCase();

    const matchesSearch =
      !search ||
      title.includes(search) ||
      content.includes(search);

    const matchesCategory =
      activeCategory === "all" ||
      category === activeCategory;

    return matchesSearch && matchesCategory;

  });


  videoCount.textContent =
    `${filtered.length} ${filtered.length === 1 ? "video" : "videos"}`;


  if (!filtered.length) {

    videoList.innerHTML = `
      <div class="sm:col-span-2 lg:col-span-3 text-center py-20 text-gray-500">

        <i class="fa-brands fa-youtube text-5xl mb-4"></i>

        <p class="text-lg font-bold">
          No videos found
        </p>

        <p class="text-sm mt-2">
          Try another search or category.
        </p>

      </div>
    `;

    return;

  }


  renderFeatured(filtered[0]);


  videoList.innerHTML =
    filtered.slice(1).map(video => {

      const youtubeId =
        video.youtubeId ||
        getYouTubeId(video.videoUrl || "");

      const thumbnail =
        video.thumbnailUrl ||
        video.image ||
        `https://i.ytimg.com/vi/${youtubeId}/hqdefault.jpg`;

      return `

        <article
          class="video-card overflow-hidden rounded-2xl"
        >

          <button
            type="button"
            class="relative video-thumb w-full text-left"
            data-video-id="${escapeHTML(video.id)}"
          >

            <img
              src="${escapeHTML(thumbnail)}"
              alt="${escapeHTML(video.title || "Video")}"
              loading="lazy"
            >

            <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent"></div>

            <div class="absolute inset-0 flex items-center justify-center">

              <span class="play-button">
                <i class="fa-solid fa-play ml-1"></i>
              </span>

            </div>

            <span class="absolute bottom-3 left-3 px-2.5 py-1 rounded-lg bg-black/70 backdrop-blur text-[10px] font-bold text-white">
              ${escapeHTML(categoryName(video.category))}
            </span>

          </button>

          <div class="p-4">

            <h3 class="font-black text-base leading-snug line-clamp-2">
              ${escapeHTML(video.title || "Untitled video")}
            </h3>

            <p class="text-sm text-gray-400 mt-2 line-clamp-2">
              ${escapeHTML(video.content || "")}
            </p>

            <div class="flex items-center justify-between mt-4 text-[11px] text-gray-500">

              <span>
                <i class="fa-regular fa-calendar mr-1"></i>
                ${formatDate(video.createdAt || video.updatedAt)}
              </span>

              <div class="flex items-center gap-3 text-[11px]">
                <button type="button" class="video-social-btn" data-video-action="like" data-video-id="${escapeHTML(video.id)}">
                  <i class="fa-solid fa-heart"></i><span>${Number(video.likesCount || 0)}</span>
                </button>

                <button type="button" class="video-social-btn" data-video-action="comment" data-video-id="${escapeHTML(video.id)}">
                  <i class="fa-solid fa-comment"></i><span>${Number(video.commentsCount || 0)}</span>
                </button>

                <button type="button" class="video-social-btn" data-video-action="repost" data-video-id="${escapeHTML(video.id)}">
                  <i class="fa-solid fa-retweet"></i><span>${Number(video.repostsCount || 0)}</span>
                </button>

                <button type="button" class="video-social-btn" data-video-action="share" data-video-id="${escapeHTML(video.id)}">
                  <i class="fa-solid fa-share-nodes"></i><span>Share</span><span>${Number(video.sharesCount || 0)}</span>
                </button>

                <span class="text-green-400 font-bold">
                  <i class="fa-solid fa-play mr-1"></i>
                  Watch
                </span>
              </div>

            </div>

          </div>

        </article>

      `;

    }).join("");

}



async function handleVideoSocialAction(action, videoId) {
  const user = auth.currentUser;

  if (!user) {
    alert("Please login first to use social features.");
    return;
  }

  try {
    const postRef = doc(db, "posts", videoId);

    if (action === "like") {
      const likeRef = doc(db, "posts", videoId, "likes", user.uid);
      const likeSnap = await getDoc(likeRef);

      if (likeSnap.exists()) {
        await deleteDoc(likeRef);
        await setDoc(
          postRef,
          { likesCount: increment(-1) },
          { merge: true }
        );
      } else {
        await setDoc(likeRef, {
          uid: user.uid,
          createdAt: serverTimestamp()
        });

        await setDoc(
          postRef,
          { likesCount: increment(1) },
          { merge: true }
        );
      }

      await loadVideos();
      return;
    }

    if (action === "comment") {
      const text = prompt("Write your comment:");

      if (!text || !text.trim()) return;

      await addDoc(
        collection(db, "posts", videoId, "comments"),
        {
          uid: user.uid,
          userName: user.displayName || "FootballXtra User",
          userPhoto: user.photoURL || "",
          text: text.trim(),
          createdAt: serverTimestamp()
        }
      );

      await setDoc(
        postRef,
        { commentsCount: increment(1) },
        { merge: true }
      );

      alert("Comment added ✅");
      await loadVideos();
      return;
    }

    if (action === "repost") {
      const repostRef = doc(db, "posts", videoId, "reposts", user.uid);
      const repostSnap = await getDoc(repostRef);

      if (repostSnap.exists()) {
        alert("You already reposted this video.");
        return;
      }

      await setDoc(repostRef, {
        uid: user.uid,
        createdAt: serverTimestamp()
      });

      await setDoc(
        postRef,
        { repostsCount: increment(1) },
        { merge: true }
      );

      alert("Video reposted 🔁");
      await loadVideos();
      return;
    }

    if (action === "share") {
      const url =
        `${window.location.origin}/videos.html?video=${encodeURIComponent(videoId)}`;

      const postRef = doc(db, "posts", videoId);

      await setDoc(
        postRef,
        { sharesCount: increment(1) },
        { merge: true }
      );

      if (navigator.share) {
        try {
          await navigator.share({
            title: "VibeSport",
            text: "Check this football video on VibeSport",
            url
          });
        } catch {
          console.log("Share cancelled");
        }
      } else {
        try {
          await navigator.clipboard.writeText(url);
          alert("Video link copied ✅");
        } catch {
          alert(url);
        }
      }
    }

  } catch (error) {
    console.error("Video social action error:", error);
    alert("Something went wrong. Please try again.");
  }
}


document.addEventListener("click", event => {

  const socialButton =
    event.target.closest("[data-video-action]");

  if (!socialButton) return;

  event.preventDefault();
  event.stopImmediatePropagation();

  const action = socialButton.dataset.videoAction;
  const videoId = socialButton.dataset.videoId;

  if (action && videoId) {
    handleVideoSocialAction(action, videoId);
  }

});


document.addEventListener("click", event => {

  const socialButton =
    event.target.closest("[data-video-action]");

  if (socialButton) {
    event.preventDefault();
    event.stopPropagation();
    return;
  }

  const card =
    event.target.closest("[data-video-id]");

  if (card) {

    const video =
      allVideos.find(
        item => item.id === card.dataset.videoId
      );

    if (video) playVideo(video);

    return;
  }

  const featured =
    event.target.closest("[data-featured-id]");

  if (featured) {

    const video =
      allVideos.find(
        item => item.id === featured.dataset.featuredId
      );

    if (video) playVideo(video);
  }

});


videoSearch.addEventListener(
  "input",
  renderVideos
);


document.querySelectorAll(".category-btn").forEach(
  button => {

    button.addEventListener("click", () => {

      document
        .querySelectorAll(".category-btn")
        .forEach(btn => btn.classList.remove("active"));

      button.classList.add("active");

      activeCategory =
        button.dataset.category;

      renderVideos();
});

  }
);


async function loadVideos() {

  try {

    const q =
      query(
        collection(db, "posts"),
        orderBy("createdAt", "desc")
      );

    const snapshot =
      await getDocs(q);

    allVideos =
      snapshot.docs
        .map(doc => ({
          id: doc.id,
          ...doc.data()
        }))
        .filter(
          video => video.type === "video"
        );

    renderVideos();
    
    const sharedVideoId =
      new URLSearchParams(window.location.search).get("video");

    if (sharedVideoId) {
      const sharedVideo =
        allVideos.find(video => video.id === sharedVideoId);

      if (sharedVideo) {
        console.log("✅ SHARED VIDEO FOUND:", sharedVideo.id, sharedVideo.youtubeId, sharedVideo.videoUrl);
        alert("VIDEO FOUND ✅\nID: " + sharedVideo.id + "\nYouTube ID: " + (sharedVideo.youtubeId || "MISSING") + "\nVideo URL: " + (sharedVideo.videoUrl || "MISSING"));
        setTimeout(() => playVideo(sharedVideo), 300);
      } else {
        console.log("❌ SHARED VIDEO NOT FOUND:", sharedVideoId);
        console.log("Available video IDs:", allVideos.map(video => video.id));
      }
    }

  } catch (error) {

    console.error("Videos error:", error);

    videoList.innerHTML = `
      <div class="sm:col-span-2 lg:col-span-3 text-center py-20 text-red-400">
        Failed to load videos.
      </div>
    `;

  }

}


loadVideos();

</script>

</body>
</html>
