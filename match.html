<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Match Details - FootballXtra</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      background:#07110d;
      color:white;
      min-height:100vh;
    }

    .glass {
      background:rgba(255,255,255,.05);
      border:1px solid rgba(255,255,255,.08);
      backdrop-filter:blur(12px);
    }
  </style>
</head>

<body>

<header class="sticky top-0 z-50 glass">
  <div class="max-w-6xl mx-auto px-4 py-4 flex justify-between items-center">

    <a href="scores.html"
       class="text-gray-300 hover:text-green-400">
      <i class="fa-solid fa-arrow-left mr-2"></i>
      Live Scores
    </a>

    <div class="font-black text-xl">
      <span class="text-green-400">Football</span>Xtra
    </div>

  </div>
</header>


<main class="max-w-6xl mx-auto px-4 py-6">

  <div id="loading"
       class="glass rounded-3xl p-12 text-center">

    <i class="fa-solid fa-spinner fa-spin text-green-400 text-3xl mb-4"></i>

    <p class="font-bold">
      Loading match...
    </p>

  </div>


  <div id="error"
       class="hidden glass rounded-3xl p-10 text-center">

    <i class="fa-solid fa-circle-exclamation text-red-400 text-3xl mb-4"></i>

    <p id="errorText"
       class="font-bold text-gray-300">
    </p>

  </div>


  <div id="content"
       class="hidden">


    <!-- MATCH HEADER -->

    <section class="glass rounded-3xl p-6 md:p-10">

      <div class="text-center mb-8">

        <p id="league"
           class="text-green-400 font-black text-lg">
        </p>

        <p id="country"
           class="text-gray-500 text-sm mt-1">
        </p>

        <div id="status"
             class="inline-block mt-4 px-4 py-2 rounded-full bg-red-500/10 text-red-400 text-xs font-black">
        </div>

      </div>


      <div class="grid grid-cols-3 items-center gap-3">


        <!-- HOME -->

        <div class="text-center">

          <img id="homeLogo"
               class="w-20 h-20 md:w-28 md:h-28 object-contain mx-auto"
               alt="Home">

          <h2 id="homeName"
              class="font-black text-base md:text-2xl mt-4">
          </h2>

        </div>


        <!-- SCORE -->

        <div class="text-center">

          <div id="score"
               class="text-4xl md:text-6xl font-black">
            0 - 0
          </div>

          <p id="time"
             class="text-gray-500 text-sm mt-2">
          </p>

        </div>


        <!-- AWAY -->

        <div class="text-center">

          <img id="awayLogo"
               class="w-20 h-20 md:w-28 md:h-28 object-contain mx-auto"
               alt="Away">

          <h2 id="awayName"
              class="font-black text-base md:text-2xl mt-4">
          </h2>

        </div>

      </div>

    </section>


    <!-- VENUE -->

    <section class="glass rounded-2xl p-5 mt-5">

      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 text-center">

        <div>

          <p class="text-xs text-gray-500">
            Venue
          </p>

          <p id="venue"
             class="font-bold mt-1">
          </p>

        </div>


        <div>

          <p class="text-xs text-gray-500">
            Round
          </p>

          <p id="round"
             class="font-bold mt-1">
          </p>

        </div>


        <div>

          <p class="text-xs text-gray-500">
            Referee
          </p>

          <p id="referee"
             class="font-bold mt-1">
          </p>

        </div>


        <div>

          <p class="text-xs text-gray-500">
            Date
          </p>

          <p id="date"
             class="font-bold mt-1">
          </p>

        </div>

      </div>

    </section>


    <!-- EVENTS + STATISTICS -->

    <div class="grid grid-cols-1 md:grid-cols-2 gap-6 mt-8">

    <!-- EVENTS -->

    <section>

      <h2 class="text-xl font-black mb-4">

        <i class="fa-solid fa-bolt text-yellow-400 mr-2"></i>

        Match Events

      </h2>


      <div id="events"
           class="glass rounded-2xl p-5">
      </div>

    </section>




    <!-- MATCH STATISTICS -->
    <section>
      <h2 class="text-xl font-black mb-4">
        <i class="fa-solid fa-chart-simple text-green-400 mr-2"></i>
        Match Statistics
      </h2>

      <div id="statistics" class="glass rounded-2xl p-5">
        <p class="text-gray-400 text-center">Loading statistics...</p>
      </div>
    </section>

    </div>

    <!-- LINEUPS -->

    <section class="mt-8">

      <h2 class="text-xl font-black mb-4">

        <i class="fa-solid fa-users text-blue-400 mr-2"></i>

        Lineups

      </h2>


      <div id="lineups"
           class="grid md:grid-cols-2 gap-5">
      </div>

    </section>


  </div>

</main>


<script>

const API_BASE = "https://footballxtra-website.onrender.com";
const params = new URLSearchParams(window.location.search);

const fixtureId = params.get("fixture") || new URLSearchParams(window.location.hash.slice(1)).get("fixture") || window.location.pathname.split("/").filter(Boolean).pop();

console.log("MATCH URL:", window.location.href, "FIXTURE:", fixtureId);


const loading =
  document.getElementById("loading");

const errorBox =
  document.getElementById("error");

const errorText =
  document.getElementById("errorText");

const content =
  document.getElementById("content");


function escapeHTML(value = "") {

  return String(value)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");

}


function showError(message) {

  loading.classList.add("hidden");

  content.classList.add("hidden");

  errorBox.classList.remove("hidden");

  errorText.textContent = message;

}



async function loadEvents() {
  const box = document.getElementById("events");
  if (!box || !fixtureId) return;

  try {
    const response = await fetch(
      `${API_BASE}/api/matches/espn/${encodeURIComponent(fixtureId)}`,
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "Failed to load events");
    }

    const plays = Array.isArray(data.plays) ? data.plays : [];
    const competition = data.header?.competitions?.[0] || {};
    const competitors = competition.competitors || [];

    const home = competitors.find(x => x.homeAway === "home") || {};
    const away = competitors.find(x => x.homeAway === "away") || {};

    const homeTeam = home.team || {};
    const awayTeam = away.team || {};

    const homeId = String(homeTeam.id || home.id || "");
    const awayId = String(awayTeam.id || away.id || "");

    const homeEvents = plays.filter(play =>
      String(play.team?.id || "") === homeId
    );

    const awayEvents = plays.filter(play =>
      String(play.team?.id || "") === awayId
    );

    const renderEvent = (play, align = "left") => {
      const minute = play.clock?.displayValue || "";
      const team = play.team?.displayName || "";

      const players = Array.isArray(play.participants)
        ? play.participants
            .map(p => p.athlete?.displayName)
            .filter(Boolean)
        : [];

      let icon = "⚽";
      let title = "Goal";

      if (play.yellowCard) {
        icon = "🟨";
        title = "Yellow Card";
      } else if (play.redCard) {
        icon = "🟥";
        title = "Red Card";
      } else if (play.substitution) {
        icon = "🔄";
        title = "Substitution";
      } else if (play.penaltyKick) {
        icon = "⚽";
        title = "Penalty";
      }

      return `
        <div class="flex items-start gap-3 py-3 border-b border-white/10 last:border-0 ${
          align === "right" ? "flex-row-reverse text-right" : ""
        }">
          <div class="w-12 shrink-0 text-center font-black text-green-400">
            ${escapeHTML(minute)}
          </div>

          <div class="text-xl shrink-0">
            ${icon}
          </div>

          <div class="min-w-0 flex-1">
            <div class="font-bold">
              ${escapeHTML(title)}
            </div>

            ${
              players.length
                ? `<div class="text-sm mt-1 text-gray-300">
                    ${players.map(escapeHTML).join(" · ")}
                  </div>`
                : `<div class="text-xs text-gray-500 mt-1">
                    ${escapeHTML(team)}
                  </div>`
            }
          </div>
        </div>
      `;
    };

    const renderColumn = (team, events, align) => `
      <div class="glass rounded-2xl p-4">
        <div class="flex items-center ${
          align === "right" ? "justify-end" : "justify-start"
        } gap-3 mb-3">
          ${
            team.logos?.[0]?.href
              ? `<img src="${team.logos[0].href}" class="w-8 h-8 object-contain">`
              : ""
          }

          <h3 class="font-black text-base">
            ${escapeHTML(team.displayName || team.name || "Team")}
          </h3>
        </div>

        ${
          events.length
            ? events.map(event => renderEvent(event, align)).join("")
            : `<div class="text-center py-6 text-gray-500 text-sm">
                No events
              </div>`
        }
      </div>
    `;

    box.innerHTML = `
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        ${renderColumn(homeTeam, homeEvents, "left")}
        ${renderColumn(awayTeam, awayEvents, "right")}
      </div>
    `;

  } catch (error) {
    console.error("❌ ESPN Events error:", error);

    box.innerHTML = `
      <div class="text-center py-6 text-gray-400">
        Match events could not be loaded.
      </div>`;
  }
}

async function loadLineups() {
  const box = document.getElementById("lineups");
  if (!box || !fixtureId) return;

  try {
    const response = await fetch(
      `${API_BASE}/api/matches/espn/${encodeURIComponent(fixtureId)}`,
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "Failed to load lineups");
    }

    let rosters = Array.isArray(data.rosters) ? [...data.rosters] : [];

    const competitors =
      data.header?.competitions?.[0]?.competitors || [];

    const homeId = String(
      competitors.find(c => c.homeAway === "home")?.team?.id || ""
    );

    const awayId = String(
      competitors.find(c => c.homeAway === "away")?.team?.id || ""
    );

    rosters.sort((a, b) => {
      const aId = String(a.team?.id || "");
      const bId = String(b.team?.id || "");

      if (aId === homeId) return -1;
      if (bId === homeId) return 1;
      if (aId === awayId) return 1;
      if (bId === awayId) return -1;

      return 0;
    });

    if (!rosters.length) {
      box.innerHTML = `
        <div class="md:col-span-2 text-center py-6 text-gray-400">
          Lineups are not available yet.
        </div>`;
      return;
    }

    box.innerHTML = rosters.map(teamRoster => {
      const team = teamRoster.team || {};
      const players = Array.isArray(teamRoster.roster)
        ? teamRoster.roster
        : [];

      const starters = players.filter(player => player.starter);
      const substitutes = players.filter(player => !player.starter);

      const renderPlayer = player => {
        const athlete = player.athlete || {};
        const position = player.position || {};

        const name =
          athlete.displayName ||
          athlete.fullName ||
          "Unknown Player";

        const positionName =
          position.displayName ||
          position.name ||
          "";

        const jersey = player.jersey || "";

        let badge = "SUB";

        if (player.starter) {
          badge = "START";
        } else if (player.subbedIn) {
          badge = "IN";
        } else if (player.subbedOut) {
          badge = "OUT";
        }

        return `
          <div class="flex items-center gap-3 py-3 border-b border-white/10 last:border-0">
            <div class="w-9 h-9 rounded-full bg-white/10 flex items-center justify-center font-black text-sm">
              ${escapeHTML(jersey)}
            </div>

            <div class="flex-1 min-w-0">
              <div class="font-bold truncate">
                ${escapeHTML(name)}
              </div>

              <div class="text-xs text-gray-400">
                ${escapeHTML(positionName)}
              </div>
            </div>

            <span class="text-[10px] font-black px-2 py-1 rounded-full bg-white/10">
              ${escapeHTML(badge)}
            </span>
          </div>
        `;
      };

      return `
        <div class="glass rounded-2xl p-5">
          <div class="flex items-center gap-3 mb-4">
            ${
              team.logo
                ? `<img src="${team.logo}" class="w-10 h-10 object-contain">`
                : ""
            }

            <div>
              <h3 class="font-black text-lg">
                ${escapeHTML(team.displayName || team.name || "Team")}
              </h3>
              <p class="text-xs text-gray-400">
                ${players.length} players
              </p>
            </div>
          </div>

          <h4 class="text-sm font-black text-green-400 mb-2">
            Starting XI
          </h4>

          <div>
            ${
              starters.length
                ? starters.map(renderPlayer).join("")
                : `<p class="text-sm text-gray-500 py-3">No starting lineup available.</p>`
            }
          </div>

          <h4 class="text-sm font-black text-blue-400 mt-5 mb-2">
            Substitutes
          </h4>

          <div>
            ${
              substitutes.length
                ? substitutes.map(renderPlayer).join("")
                : `<p class="text-sm text-gray-500 py-3">No substitutes available.</p>`
            }
          </div>
        </div>
      `;
    }).join("");

  } catch (error) {
    console.error("❌ ESPN Lineups error:", error);

    box.innerHTML = `
      <div class="md:col-span-2 text-center py-6 text-gray-400">
        Lineups could not be loaded.
      </div>`;
  }
}


async function loadStatistics() {
  const box = document.getElementById("statistics");
  if (!box || !fixtureId) return;

  try {
    const response = await fetch(
      `${API_BASE}/api/matches/espn/${encodeURIComponent(fixtureId)}`,
      { cache: "no-store" }
    );

    const data = await response.json();

    if (!response.ok || !data.success) {
      throw new Error(data.message || "Failed to load statistics");
    }

    const teams = Array.isArray(data.boxscore?.teams)
      ? data.boxscore.teams
      : [];

    if (teams.length < 2) {
      box.innerHTML = `
        <div class="text-center py-6">
          <i class="fa-solid fa-chart-simple text-3xl text-gray-500 mb-3"></i>
          <p class="text-gray-400">Statistics are not available yet.</p>
        </div>`;
      return;
    }

    const home = teams.find(t => t.homeAway === "home") || teams[0];
    const away = teams.find(t => t.homeAway === "away") || teams[1];

    const getStat = (teamStats, name) => {
      const item = (teamStats?.statistics || []).find(
        x => String(x.name || "").toLowerCase() === name.toLowerCase()
      );

      return item?.displayValue ?? "-";
    };

    const stats = [
      ["possessionPct", "Possession", "fa-chart-pie"],
      ["totalShots", "Total Shots", "fa-bullseye"],
      ["shotsOnTarget", "Shots on Goal", "fa-crosshairs"],
      ["wonCorners", "Corner Kicks", "fa-flag"],
      ["offsides", "Offsides", "fa-person-running"],
      ["foulsCommitted", "Fouls", "fa-hand"],
      ["yellowCards", "Yellow Cards", "fa-square"],
      ["redCards", "Red Cards", "fa-square"],
      ["saves", "Goalkeeper Saves", "fa-hand"],
      ["totalPasses", "Total Passes", "fa-arrows-left-right"],
      ["accuratePasses", "Accurate Passes", "fa-check"],
      ["passPct", "Pass Completion", "fa-percent"],
      ["blockedShots", "Blocked Shots", "fa-shield"]
    ];

    const homeTeam = home.team || {};
    const awayTeam = away.team || {};

    const renderStats = (team) => `
      <div class="space-y-2">
        ${stats.map(([name, label, icon]) => `
          <div class="flex items-center justify-between gap-3 py-2 border-b border-white/10 last:border-0">
            <span class="font-black text-sm">
              ${getStat(team, name)}
            </span>

            <span class="text-xs text-gray-400 text-center flex-1">
              <i class="fa-solid ${icon} mr-1"></i>${label}
            </span>
          </div>
        `).join("")}
      </div>
    `;

    box.innerHTML = `
      <div class="grid grid-cols-2 gap-2">

        <div class="glass rounded-2xl p-3">
          <div class="flex items-center justify-center gap-3 mb-4">
            ${
              homeTeam.logo
                ? `<img src="${homeTeam.logo}" class="w-9 h-9 object-contain">`
                : ""
            }
            <h3 class="font-black text-center">
              ${escapeHTML(homeTeam.displayName || homeTeam.name || "Home")}
            </h3>
          </div>

          ${renderStats(home)}
        </div>

        <div class="glass rounded-2xl p-3">
          <div class="flex items-center justify-center gap-3 mb-4">
            ${
              awayTeam.logo
                ? `<img src="${awayTeam.logo}" class="w-9 h-9 object-contain">`
                : ""
            }
            <h3 class="font-black text-center">
              ${escapeHTML(awayTeam.displayName || awayTeam.name || "Away")}
            </h3>
          </div>

          ${renderStats(away)}
        </div>

      </div>
    `;
  } catch (error) {
    console.error("❌ ESPN Statistics error:", error);

    box.innerHTML = `
      <div class="text-center py-6">
        <i class="fa-solid fa-triangle-exclamation text-yellow-400 text-2xl mb-2"></i>
        <p class="text-gray-400">Statistics could not be loaded.</p>
      </div>`;
  }
}
async function loadMatch() {
  if (!fixtureId) {
    showError("No fixture ID found.");
    return;
  }

  try {
    const response = await fetch(
      `${API_BASE}/api/matches/espn/${encodeURIComponent(fixtureId)}`,
      { cache: "no-store" }
    );

    if (!response.ok) {
      const data = await response.json().catch(() => ({}));
      throw new Error(data.message || `HTTP ${response.status}`);
    }

    const data = await response.json();

    if (!data.success || !data.header) {
      throw new Error("Match data unavailable");
    }

    const header = data.header || {};
    const competition = header.competitions?.[0] || {};
    const competitors = competition.competitors || [];

    const home = competitors.find(x => x.homeAway === "home") || {};
    const away = competitors.find(x => x.homeAway === "away") || {};

    const homeTeam = home.team || {};
    const awayTeam = away.team || {};

    const statusType = competition.status?.type || {};

    const homeScore = home.score ?? 0;
    const awayScore = away.score ?? 0;

    const state = String(statusType.state || "").toLowerCase();
    const detail = statusType.detail || statusType.shortDetail || "";

    const isLive = state === "in";
    const isFinished = state === "post";

    const leagueName =
      header.season?.name ||
      homeTeam.groups?.name ||
      "Football";

    const countryMap = {
      "eng.1": "England",
      "esp.1": "Spain",
      "ita.1": "Italy",
      "ger.1": "Germany",
      "fra.1": "France",
      "uefa.champions": "Europe"
    };

    const country = countryMap[data.competition] || "";

    const kickoff = competition.date
      ? new Date(competition.date).toLocaleString("en-GB", {
          dateStyle: "medium",
          timeStyle: "short",
          timeZone: "Africa/Addis_Ababa"
        })
      : "-";

    document.getElementById("league").textContent = leagueName;
    document.getElementById("country").textContent = country;

    document.getElementById("homeName").textContent =
      homeTeam.displayName || homeTeam.name || "Home";

    document.getElementById("awayName").textContent =
      awayTeam.displayName || awayTeam.name || "Away";

    const homeLogo =
      homeTeam.logos?.[0]?.href || "";

    const awayLogo =
      awayTeam.logos?.[0]?.href || "";

    document.getElementById("homeLogo").src = homeLogo;
    document.getElementById("awayLogo").src = awayLogo;

    document.getElementById("homeLogo").style.display =
      homeLogo ? "" : "none";

    document.getElementById("awayLogo").style.display =
      awayLogo ? "" : "none";

    document.getElementById("homeLogo").onerror = function () {
      this.style.display = "none";
    };

    document.getElementById("awayLogo").onerror = function () {
      this.style.display = "none";
    };

    document.getElementById("score").textContent =
      `${homeScore} - ${awayScore}`;

    document.getElementById("status").textContent =
      isLive
        ? `🔴 LIVE ${detail}`
        : isFinished
          ? "⚪ FT"
          : `🕐 ${detail || "Scheduled"}`;

    document.getElementById("time").textContent =
      isLive ? detail : "";

    document.getElementById("venue").textContent =
      competition.venue?.fullName ||
      competition.venue?.name ||
      "Unknown";

    document.getElementById("round").textContent =
      competition.week?.number
        ? `Week ${competition.week.number}`
        : "-";

    document.getElementById("referee").textContent =
      competition.officials?.[0]?.fullName ||
      competition.officials?.[0]?.displayName ||
      "Unknown";

    document.getElementById("date").textContent = kickoff;

    loading.classList.add("hidden");
    errorBox.classList.add("hidden");
    content.classList.remove("hidden");

    await Promise.all([
      loadEvents(),
      loadLineups(),
      loadStatistics()
    ]);

  } catch (error) {
    console.error("❌ ESPN match load error:", error);
    showError(error.message || "Unable to load match.");
  }
}
loadMatch();


setInterval(
  loadMatch,
  60000
);

</script>


</body>
</html>
