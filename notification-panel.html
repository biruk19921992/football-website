<!-- NOTIFICATION PANEL -->
<div
  id="notificationDropdown"
  class="hidden fixed top-20 right-4 w-[350px] max-w-[calc(100vw-2rem)] glass rounded-2xl border border-white/10 shadow-2xl z-[9999] overflow-hidden">

  <div class="flex items-center justify-between px-4 py-4 border-b border-white/10">
    <div class="flex items-center gap-2">
      <i class="fa-regular fa-bell text-green-400"></i>
      <h3 class="font-bold text-white">Notifications</h3>
    </div>

    <button
      id="markAllReadBtn"
      type="button"
      class="text-xs text-green-400 hover:text-green-300 font-semibold">
      Mark all as read
    </button>
  </div>

  <div
    id="notificationList"
    class="max-h-[420px] overflow-y-auto">

    <div
      id="emptyNotifications"
      class="px-6 py-12 text-center text-gray-400">

      <i class="fa-regular fa-bell-slash text-3xl mb-3"></i>

      <p class="text-sm">
        No notifications yet
      </p>

    </div>

  </div>
</div>
