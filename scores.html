<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Live Scores - VibeSport</title>


  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

  <style>
    body {
      background: #07110d;
      color: white;
      min-height: 100vh;
    }

    .glass {
      background: rgba(255,255,255,.05);
      border: 1px solid rgba(255,255,255,.08);
      backdrop-filter: blur(12px);
    }
  </style>

<style id="vibesport-scores-premium">
  :root {
    color-scheme: dark;
    --vs-bg: #07110e;
    --vs-card: rgba(17, 32, 27, .88);
    --vs-border: rgba(255,255,255,.09);
    --vs-green: #22c55e;
    --vs-cyan: #22d3ee;
  }

  html {
    background: var(--vs-bg);
    scroll-behavior: smooth;
  }

  body {
    background:
      radial-gradient(ellipse at 10% 0%, rgba(34,197,94,.11), transparent 38%),
      radial-gradient(ellipse at 95% 20%, rgba(34,211,238,.07), transparent 30%),
      var(--vs-bg) !important;
    color: #f8fafc;
  }

  header.glass {
    background: rgba(7,17,14,.88) !important;
    border-bottom: 1px solid var(--vs-border);
    backdrop-filter: blur(18px);
    -webkit-backdrop-filter: blur(18px);
  }

  main {
    padding-top: 2rem;
    padding-bottom: 5rem;
  }

  main h1 {
    letter-spacing: -.04em;
    background: linear-gradient(100deg,#fff 25%,#86efac 75%,#67e8f9);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  .glass {
    background: linear-gradient(145deg,rgba(22,40,33,.91),rgba(10,23,19,.92)) !important;
    border: 1px solid var(--vs-border) !important;
    box-shadow: 0 10px 28px rgba(0,0,0,.16);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
  }

  #refreshScores {
    border-color: rgba(34,197,94,.3) !important;
    color: #bbf7d0;
    transition: transform .2s ease, background .2s ease;
  }

  #refreshScores:hover {
    background: rgba(34,197,94,.13) !important;
    transform: translateY(-1px);
  }

  #scoreDateNav,
  #leagueNav {
    scrollbar-width: thin;
    scrollbar-color: #276749 transparent;
  }

  .score-tab,
  .league-tab {
    flex-shrink: 0;
    border-radius: 999px !important;
    border-color: rgba(255,255,255,.10) !important;
    transition: background .2s ease, border-color .2s ease;
  }

  .score-tab:hover,
  .league-tab:hover {
    border-color: rgba(34,197,94,.55) !important;
    background: rgba(34,197,94,.09) !important;
  }

  .score-tab.border-green-400,
  .league-tab.active {
    background: linear-gradient(135deg,rgba(34,197,94,.2),rgba(34,211,238,.08)) !important;
    border-color: rgba(74,222,128,.6) !important;
    color: #86efac !important;
    box-shadow: 0 0 18px rgba(34,197,94,.08);
  }

  #scoreDatePicker {
    border-color: var(--vs-border);
    accent-color: var(--vs-green);
    max-width: 100%;
  }

  #scoresStatus {
    color: #94a3b8;
  }

  #liveScores article {
    position: relative;
    overflow: hidden;
    border-radius: 20px !important;
    padding: 20px !important;
    background:
      radial-gradient(circle at 50% 0%,rgba(34,197,94,.07),transparent 65%),
      linear-gradient(145deg,rgba(19,35,29,.98),rgba(8,20,16,.98)) !important;
    border: 1px solid rgba(255,255,255,.09) !important;
    box-shadow: 0 12px 32px rgba(0,0,0,.22);
    transition: transform .2s ease,border-color .2s ease,box-shadow .2s ease;
  }

  #liveScores article:hover {
    transform: translateY(-3px);
    border-color: rgba(74,222,128,.38) !important;
    box-shadow: 0 16px 34px rgba(0,0,0,.3);
  }

  #liveScores article img {
    filter: drop-shadow(0 3px 8px rgba(0,0,0,.25));
  }

  #liveScores article .text-2xl {
    color: #f8fafc;
    font-size: clamp(1.35rem,4vw,1.8rem);
    font-variant-numeric: tabular-nums;
    letter-spacing: -.04em;
  }

  #liveScores article .text-red-400 {
    color: #fca5a5 !important;
  }

  #liveScores article .animate-pulse {
    color: #ef4444;
    filter: drop-shadow(0 0 5px rgba(239,68,68,.5));
  }

  @media (max-width: 640px) {
    main {
      padding-top: 1.25rem;
      padding-left: 1rem;
      padding-right: 1rem;
    }

    main h1 {
      font-size: 1.8rem;
    }

    #refreshScores {
      padding: .65rem .8rem;
    }

    #liveScores article {
      padding: 16px !important;
    }

    #liveScores article img,
    #liveScores article .w-14.h-14 {
      width: 44px;
      height: 44px;
    }

    #liveScores article .text-sm {
      font-size: .8rem;
    }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      scroll-behavior: auto !important;
      transition-duration: .01ms !important;
      animation-duration: .01ms !important;
    }
  }
</style>

</head>

<body>

  <header class="sticky top-0 z-50 glass">
    <div class="max-w-7xl mx-auto px-4 py-4 flex items-center justify-between">

      <a href="index.html"
         class="font-black text-xl">
        Vibe<span class="text-green-400">Sport</span>
      </a>

      <a href="index.html"
         class="text-sm text-gray-300 hover:text-green-400">
        <i class="fa-solid fa-arrow-left mr-2"></i>
        Home
      </a>

    </div>
  </header>


  <main class="max-w-7xl mx-auto px-4 py-8">

    <div class="flex items-center justify-between mb-6">
      <div>
        <h1 class="text-3xl font-black">
          Live Scores
        </h1>

        <p class="text-sm text-gray-500 mt-1">
          Live football matches
        </p>
      </div>

      <button
        id="refreshScores"
        class="glass px-4 py-2 rounded-xl text-sm font-bold hover:border-green-400/40 transition">
        <i class="fa-solid fa-rotate mr-2"></i>
        Refresh
      </button>
    </div>


    <div class="flex gap-2 overflow-x-auto pb-2 mb-5" id="scoreDateNav">
      <button data-score-tab="yesterday" class="score-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        Yesterday
      </button>

      <button data-score-tab="today" class="score-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        Today
      </button>

      <button data-score-tab="live" class="score-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        🔴 Live
      </button>

      <button data-score-tab="tomorrow" class="score-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        Tomorrow
      </button>
    </div>

    <div class="flex items-center gap-3 mb-5">
      <label for="scoreDatePicker" class="text-sm font-bold whitespace-nowrap">📅 Date</label>
      <input
        type="date"
        id="scoreDatePicker"
        class="glass px-4 py-2 rounded-xl text-sm font-bold outline-none text-white bg-transparent"
      >
    </div>

    <div
      id="leagueNav"
      class="flex gap-2 overflow-x-auto pb-3 mb-6 sticky top-[73px] z-40"
      style="background:rgba(7,17,13,.94);backdrop-filter:blur(14px);">

      <button data-league="all"
        class="league-tab active glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        All
      </button>

      <button data-league="English Premier League"
        class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        Premier League
      </button>

      <button data-league="LaLiga"
        class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        LaLiga
      </button>

      <button data-league="Serie A"
        class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        Serie A
      </button>

      <button data-league="Bundesliga"
        class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        Bundesliga
      </button>

      <button data-league="Ligue 1"
        class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        Ligue 1
      </button>

      <button data-league="UEFA Champions League"
        class="league-tab glass px-4 py-2 rounded-xl text-sm font-bold whitespace-nowrap">
        Champions League
      </button>

    </div>

    <div
      id="scoresStatus"
      class="text-sm text-gray-500 mb-5">
      Loading live matches...
    </div>


    <div
      id="liveScores"
      class="grid md:grid-cols-2 lg:grid-cols-3 gap-4">
    </div>

  </main>


  <script type="module">
console.log("SCORES JS STARTED");

    const API_BASE = "https://footballxtra-website.onrender.com";

    const container =
      document.getElementById("liveScores");

    const status =
      document.getElementById("scoresStatus");

    const refreshButton =
      document.getElementById("refreshScores");


    function escapeHTML(value = "") {

      return String(value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#039;");

    }


    function logo(url, name) {
      if (url) {
        return `
          <img
            src="${escapeHTML(url)}"
            alt="${escapeHTML(name)}"
            class="w-14 h-14 object-contain mx-auto"
            loading="lazy"
            onerror="this.style.display='none';this.nextElementSibling.style.display='flex';"
          >
          <div class="hidden w-14 h-14 rounded-full bg-white/10 mx-auto items-center justify-center text-xl">
            ⚽
          </div>
        `;
      }

      return `
        <div class="w-14 h-14 rounded-full bg-white/10 mx-auto flex items-center justify-center text-xl">
          ⚽
        </div>
      `;
    }


    function renderMatch(match) {
      const home = match.home || {};
      const away = match.away || {};
      const league = match.league || {};
      const matchStatus = match.status || {};
      const fixtureId = match.fixtureId;

      const homeScore = home.score ?? match.goals?.home ?? 0;
      const awayScore = away.score ?? match.goals?.away ?? 0;

      const short = String(matchStatus.short || "").toLowerCase();
      const longStatus = String(matchStatus.long || "").toLowerCase();
      const detail = String(matchStatus.detail || "");

      const isLive =
        short === "in" ||
        ["1h", "2h", "et", "p", "live", "bt"].includes(short);

      const isHalfTime =
        short === "ht" ||
        longStatus.includes("halftime") ||
        longStatus.includes("half time");

      const isFinished =
        short === "post" ||
        ["ft", "aet", "pen"].includes(short) ||
        longStatus.includes("final") ||
        longStatus.includes("full time");

      const kickoffTime = match.fixture?.date
        ? new Date(match.fixture.date).toLocaleTimeString("en-GB", {
            hour: "2-digit",
            minute: "2-digit",
            hour12: false,
            timeZone: "Africa/Addis_Ababa"
          })
        : "--:--";

      const displayStatus = isLive
        ? `🔴 LIVE ${detail}`.trim()
        : isHalfTime
          ? "🟡 HT"
          : isFinished
            ? "⚪ FT"
            : `🕐 ${kickoffTime}`;

      const scoreStatus = isLive
        ? (detail || "LIVE")
        : isHalfTime
          ? "HT"
          : isFinished
            ? "FT"
            : "";

      return `
        <article
          onclick="window.openMatchDetails('${fixtureId || ""}'); return false;"
          class="glass rounded-2xl p-5 hover:border-green-400/30 transition cursor-pointer">

          <div class="flex items-center justify-between gap-3 mb-5">
            <div class="min-w-0">
              <p class="font-bold text-gray-300 truncate">
                ${escapeHTML(league.name || "Football")}
              </p>

              <p class="text-xs text-gray-500 truncate">
                ${escapeHTML(league.country || "")}
              </p>
            </div>

            <span class="text-red-400 font-black text-xs whitespace-nowrap">
              ${isLive ? '<span class="animate-pulse">●</span> ' : ""}
              ${escapeHTML(displayStatus)}
            </span>
          </div>

          <div class="flex items-center justify-between gap-3">

            <div class="text-center flex-1 min-w-0">
              ${logo(home.logo, home.name)}

              <p class="font-bold text-sm mt-2 truncate">
                ${escapeHTML(home.name || "Home")}
              </p>
            </div>

            <div class="text-center shrink-0">
              <div class="text-2xl font-black">
                ${escapeHTML(homeScore)} - ${escapeHTML(awayScore)}
              </div>

              ${scoreStatus ? `
                <div class="text-[10px] text-gray-400 font-bold mt-1">
                  ${escapeHTML(scoreStatus)}
                </div>
              ` : ""}
            </div>

            <div class="text-center flex-1 min-w-0">
              ${logo(away.logo, away.name)}

              <p class="font-bold text-sm mt-2 truncate">
                ${escapeHTML(away.name || "Away")}
              </p>
            </div>

          </div>

        </article>
      `;
    }


    let selectedScoreTab = "today";
    let selectedLeague = "all";
    let selectedDateOverride = null;

    function getAddisDate(offset = 0) {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Africa/Addis_Ababa",
        year: "numeric",
        month: "2-digit",
        day: "2-digit"
      }).formatToParts(new Date());

      const y = Number(parts.find(p => p.type === "year").value);
      const m = Number(parts.find(p => p.type === "month").value);
      const d = Number(parts.find(p => p.type === "day").value);

      const date = new Date(Date.UTC(y, m - 1, d + offset));

      return date.toISOString().slice(0, 10);
    }

    const scoreDatePicker = document.getElementById("scoreDatePicker");
    if (scoreDatePicker) {
      scoreDatePicker.value = getAddisDate(0);
    }

    function updateScoreTabs() {
      document.querySelectorAll(".score-tab").forEach(tab => {
        const active = tab.dataset.scoreTab === selectedScoreTab;

        tab.classList.toggle("border-green-400", active);
        tab.classList.toggle("text-green-400", active);
        tab.classList.toggle("bg-green-500/10", active);
      });
    }


    async function loadLiveScores(tab = selectedScoreTab) {

      selectedScoreTab = tab;
      updateScoreTabs();

      const labels = {
        yesterday: "Yesterday",
        today: "Today",
        live: "🔴 Live",
        tomorrow: "Tomorrow"
      };

      status.textContent =
        `Loading ${labels[selectedScoreTab]} matches...`;


      try {

        const offset = {
          yesterday: -1,
          today: 0,
          tomorrow: 1
        };

        const date =
          selectedDateOverride ||
          getAddisDate(
            offset[selectedScoreTab] ?? 0
          );


        const response =
          await fetch(
            `${API_BASE}/api/matches/today-espn?date=${date}`,
            {
              cache: "no-store"
            }
          );


        if (!response.ok) {

          throw new Error(
            `HTTP ${response.status}`
          );

        }


        const data =
          await response.json();


        if (
          !data.success ||
          !Array.isArray(data.matches)
        ) {

          throw new Error(
            "Invalid API response"
          );

        }


        let matches = data.matches;


        if (selectedScoreTab === "live") {

          matches =
            matches.filter(match => {
              const state =
                String(
                  match?.status?.short || ""
                ).toLowerCase();

              return state === "in";
            });

        }


        if (selectedLeague !== "all") {

          matches =
            matches.filter(match => {
              const leagueName =
                String(
                  match?.league?.name || ""
                ).trim().toLowerCase();

              return leagueName ===
                selectedLeague.trim().toLowerCase();
            });

        }


        status.innerHTML = `
          <span class="text-green-400 font-bold">
            ● ${matches.length}
          </span>
          ${labels[selectedScoreTab]} matches
        `;


        if (matches.length === 0) {

          container.innerHTML = `

              <div class="md:col-span-2 lg:col-span-3 glass rounded-2xl p-10 text-center">

              <div class="text-5xl mb-4">
                ⚽
              </div>

              <p class="font-bold text-gray-300">
                ${
                  selectedScoreTab === "live"
                    ? "No live matches right now"
                    : `No matches for ${labels[selectedScoreTab]}`
                }
              </p>

              <p class="text-xs text-gray-500 mt-2">
                Check again later.
              </p>

            </div>

          `;

          return;

        }


        container.innerHTML =
          matches
            .map(renderMatch)
            .join("");


      } catch (error) {

        console.error(
          "Scores Error:",
          error
        );


        status.textContent =
          "Unable to load scores";


        container.innerHTML = `

            <div class="md:col-span-2 lg:col-span-3 glass rounded-2xl p-8 text-center">

            <i
              class="fa-solid fa-circle-exclamation text-red-400 text-3xl mb-4">
            </i>

            <p class="font-bold text-gray-300">
              Scores unavailable
            </p>

            <p class="text-xs text-gray-500 mt-2">
              Please try again shortly.
            </p>

          </div>

        `;

      }

    }


    document.querySelectorAll(".score-tab").forEach(tab => {

      tab.addEventListener("click", () => {

        selectedDateOverride = null;

        const tabName = tab.dataset.scoreTab;
        const tabOffset = {
          yesterday: -1,
          today: 0,
          live: 0,
          tomorrow: 1
        };

        if (scoreDatePicker) {
          scoreDatePicker.value =
            getAddisDate(tabOffset[tabName] ?? 0);
        }

        loadLiveScores(tabName);

      });

    });

    if (scoreDatePicker) {

      scoreDatePicker.addEventListener("change", () => {
        selectedDateOverride =
          scoreDatePicker.value || null;

        loadLiveScores(selectedScoreTab);
      });

    }


    document.querySelectorAll(".league-tab").forEach(tab => {

      tab.addEventListener("click", () => {

        selectedLeague =
          tab.dataset.league || "all";

        document.querySelectorAll(".league-tab").forEach(item => {

          const active =
            item === tab;

          item.classList.toggle(
            "border-green-400",
            active
          );

          item.classList.toggle(
            "text-green-400",
            active
          );

          item.classList.toggle(
            "bg-green-500/10",
            active
          );

          item.classList.toggle(
            "active",
            active
          );

        });

        loadLiveScores(selectedScoreTab);

      });

    });


    refreshButton.addEventListener(
      "click",
      loadLiveScores
    );


    loadLiveScores();


    setInterval(
      () => loadLiveScores(selectedScoreTab),
      30000
    );

window.openMatchDetails = function(fixtureId) {
  console.log("Opening fixture:", fixtureId);
  if (!fixtureId) return;
  window.location.href = "match.html#fixture=" + encodeURIComponent(fixtureId);
}

  </script>

<script src="./js/mini-player.js"></script>

      <i class="fa-solid fa-house"></i>

<style id="vibesport-nav-active-style">
.bottom-nav a.nav-active {
  color: #4ade80 !important;
}
</style>
<!-- VIBESPORT NAV ACTIVE STATE -->
<script>
(function () {
  function normalizePage(value) {
    const parts = (value || '').split(/[?#]/)[0].split('/').filter(Boolean);
    let page = (parts.length ? parts[parts.length - 1] : 'index.html').toLowerCase();
    page = page.replace(/\.html$/, '');
    return page || 'index';
  }

  function updateActiveNav() {
    const nav = document.querySelector('.bottom-nav');
    if (!nav) return;

    const page = normalizePage(location.pathname);

    nav.querySelectorAll('a').forEach(function (link) {
      const href = normalizePage(link.getAttribute('href'));
      const accountPage = link.id === 'mobileAccountLink' &&
        ['profile', 'login', 'signup'].includes(page);
      const active = href === page || accountPage;

      link.classList.toggle('nav-active', active);
      link.classList.toggle('text-gray-500', !active);
      link.classList.toggle('text-green-400', active);

      if (active) link.setAttribute('aria-current', 'page');
      else link.removeAttribute('aria-current');
    });
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', updateActiveNav);
  } else {
    updateActiveNav();
  }
})();
</script>
